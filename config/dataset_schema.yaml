    proposed_target_name: condition_mean_log_expression_profile_delta_vs_training_controls
    approved: false
    not_target_gene_only: true
    n_measured_genes: 5045
    formula: >
      For each canonical condition C, the target is the 5045-gene mean log-expression
      profile delta versus training-split controls:
      delta(C) = mean(X[cells in C, :]) - mean(X[training-split control cells, :]),
      where X is the stored log1p per-cell-scaled matrix.
    uses_training_controls_only: true
    paired_cell_counterfactual: false
    exact_duplicate_X_rows: 0
    zero_duplicate_X_rows_do_not_establish_no_pairing: true
    do_not_synthesize_paired_cells: true
    feature_order: gene_id
    primary_metrics: [macro_condition_mse, macro_condition_mae]
    secondary_metrics: [delta_pearson]
    baseline_skills: [common_shift, additive]
